<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TyG Reporte Partos</title>

  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TyG Reporte" />
  <meta name="theme-color" content="#2F3D28" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Work Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    #error-box { display: none; position: fixed; inset: 0; background: #fff; z-index: 9999; padding: 24px; overflow: auto; }
    #error-box pre { background: #EDE7D6; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <div id="error-box">
    <h2>Ocurrió un error</h2>
    <p>Sacale una captura a esto y mandásela a Claude para corregirlo:</p>
    <pre id="error-text"></pre>
  </div>
  <script>
    window.addEventListener("error", (e) => {
      document.getElementById("error-box").style.display = "block";
      document.getElementById("error-text").textContent = (e.error && e.error.stack) || e.message || String(e);
    });
    window.addEventListener("unhandledrejection", (e) => {
      document.getElementById("error-box").style.display = "block";
      const r = e.reason;
      document.getElementById("error-text").textContent = (r && (r.stack || r.message)) || String(r);
    });
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  </script>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyDeBLhH4lIASyLxlMg_oSwM_EZX7wzOg94",
      authDomain: "reprobovina-tyg.firebaseapp.com",
      projectId: "reprobovina-tyg",
      storageBucket: "reprobovina-tyg.firebasestorage.app",
      messagingSenderId: "162502425864",
      appId: "1:162502425864:web:49fecac926675a731c00bd",
    };
    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    const T = { pasture: "#2F3D28", pastureDk: "#22301E", tag: "#D9A62B", tagDk: "#B4841B", soil: "#A6491F", paper: "#EDE7D6", card: "#FBF8F0", ink: "#24221B", inkSoft: "#5B5A4C", line: "#D8D0B8", ok: "#3F6B3A" };
    const CAMPOS_BASE = ["Agua Sucia", "El Capricho", "Fincas Nogales", "La Charqueada", "El Albardón"];
    const CABEZA_DIAS = 45, TRAMO_DIAS = 30;

    function slug(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-"); }
    function todayISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    function daysBetween(a, b) { return Math.floor((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
    function fmtDate(iso) { const [y, m, d] = iso.split("-"); return `${d}/${m}`; }
    async function conTimeout(p, ms = 8000) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]); }

    async function traerColeccion(nombre) {
      const snap = await conTimeout(getDocs(collection(db, "partos_" + nombre)));
      return snap.docs.map((d) => d.data());
    }

    function App() {
      const [cargando, setCargando] = useState(true);
      const [registrosTodos, setRegistrosTodos] = useState([]);
      const [camposExtra, setCamposExtra] = useState([]);
      const [inicios, setInicios] = useState({}); // slug -> {inicio, auto}
      const nombresCampos = Array.from(new Set([...CAMPOS_BASE, ...camposExtra.map((c) => c.nombre)]));
      const [campo, setCampo] = useState(nombresCampos[0] || CAMPOS_BASE[0]);
      const [inicioInput, setInicioInput] = useState("");

      const cargarTodo = async () => {
        setCargando(true);
        try {
          const [regs, camps] = await Promise.all([traerColeccion("registros"), traerColeccion("campos")]);
          setRegistrosTodos(regs);
          setCamposExtra(camps);
        } catch (e) {}
        setCargando(false);
      };
      useEffect(() => { cargarTodo(); }, []);

      const registrosCampo = registrosTodos.filter((r) => slug(r.campo || "") === slug(campo));

      useEffect(() => {
        (async () => {
          try {
            const snap = await conTimeout(getDoc(doc(db, "partos_config", slug(campo))));
            if (snap.exists() && snap.data().inicio) {
              setInicios((prev) => ({ ...prev, [slug(campo)]: { inicio: snap.data().inicio, auto: false } }));
              setInicioInput(snap.data().inicio);
              return;
            }
          } catch (e) {}
          if (registrosCampo.length) {
            const auto = registrosCampo.map((r) => r.fecha).sort()[0];
            setInicios((prev) => ({ ...prev, [slug(campo)]: { inicio: auto, auto: true } }));
            setInicioInput(auto);
          } else {
            setInicios((prev) => ({ ...prev, [slug(campo)]: { inicio: null, auto: false } }));
            setInicioInput("");
          }
        })();
      }, [campo, registrosTodos.length]);

      const infoInicio = inicios[slug(campo)] || {};
      const inicio = infoInicio.inicio;

      const corregirInicio = async () => {
        if (!inicioInput) return;
        try {
          await conTimeout(setDoc(doc(db, "partos_config", slug(campo)), { inicio: inicioInput }));
          setInicios((prev) => ({ ...prev, [slug(campo)]: { inicio: inicioInput, auto: false } }));
        } catch (e) { alert("No se pudo guardar. Probá de nuevo."); }
      };

      const total = registrosCampo.length;
      const vivos = registrosCampo.filter((r) => r.estado === "vivo").length;
      const muertos = registrosCampo.filter((r) => r.estado === "muerto").length;
      const mort = total ? Math.round((muertos / total) * 1000) / 10 : 0;

      let cabeza = [], cuerpo = [], cola = [], previos = [];
      if (inicio) {
        const conDias = registrosCampo.map((r) => ({ ...r, dias: daysBetween(inicio, r.fecha) }));
        cabeza = conDias.filter((r) => r.dias >= 0 && r.dias < CABEZA_DIAS);
        cuerpo = conDias.filter((r) => r.dias >= CABEZA_DIAS && r.dias < CABEZA_DIAS + TRAMO_DIAS);
        cola = conDias.filter((r) => r.dias >= CABEZA_DIAS + TRAMO_DIAS);
        previos = conDias.filter((r) => r.dias < 0);
      }
      const pct = (n) => (total ? Math.round((n / total) * 1000) / 10 : 0);
      const rango = (desde, hasta) => {
        if (!inicio) return "";
        const d = new Date(inicio + "T00:00:00");
        const f1 = new Date(d.getTime() + desde * 86400000);
        const fmt = (dt) => `${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}`;
        if (hasta == null) return `desde ${fmt(f1)}`;
        const f2 = new Date(d.getTime() + hasta * 86400000);
        return `${fmt(f1)}–${fmt(f2)}`;
      };

      // Avance semanal
      let semanas = [];
      if (inicio) {
        const conDias = registrosCampo.map((r) => ({ ...r, dias: daysBetween(inicio, r.fecha) })).filter((r) => r.dias >= 0);
        if (conDias.length) {
          const maxSemana = Math.max(...conDias.map((r) => Math.floor(r.dias / 7)));
          for (let i = 0; i <= maxSemana; i++) {
            const v = conDias.filter((r) => Math.floor(r.dias / 7) === i && r.estado === "vivo").length;
            const m = conDias.filter((r) => Math.floor(r.dias / 7) === i && r.estado === "muerto").length;
            semanas.push({ v, m, total: v + m });
          }
        }
      }
      const maxSem = Math.max(1, ...semanas.map((s) => s.total));

      // Comparativo
      const comparativo = nombresCampos.map((c) => {
        const rs = registrosTodos.filter((r) => slug(r.campo || "") === slug(c));
        const t = rs.length, m = rs.filter((r) => r.estado === "muerto").length;
        return { campo: c, total: t, muertos: m, mort: t ? Math.round((m / t) * 1000) / 10 : 0 };
      });

      return (
        <div style={{ fontFamily: "'Work Sans',sans-serif", background: T.paper, minHeight: "100vh", color: T.ink, paddingBottom: 40 }}>
          <header style={{ background: T.pasture, color: T.paper, padding: "16px 16px 20px", position: "sticky", top: 0, zIndex: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 }}>
              <div style={{ fontFamily: "Space Grotesk,sans-serif", fontWeight: 700, fontSize: 18 }}>Reporte de parición</div>
              <select value={campo} onChange={(e) => setCampo(e.target.value)} style={{ background: "transparent", color: T.tag, border: "none", fontFamily: "Space Grotesk,sans-serif", fontWeight: 600, fontSize: 14, textAlign: "right" }}>
                {nombresCampos.map((c) => <option key={c} value={c} style={{ color: "#000" }}>{c}</option>)}
              </select>
            </div>
            <div style={{ marginTop: 14, background: T.tag, borderRadius: 12, padding: "14px 18px", display: "grid", gridTemplateColumns: "1fr 1fr", rowGap: 12 }}>
              <div style={{ textAlign: "center" }}><b style={{ display: "block", fontSize: 20, color: T.pastureDk, fontFamily: "IBM Plex Mono,monospace" }}>{total}</b><span style={{ fontSize: 10.5, color: T.pasture }}>nacidos</span></div>
              <div style={{ textAlign: "center" }}><b style={{ display: "block", fontSize: 20, color: T.pastureDk, fontFamily: "IBM Plex Mono,monospace" }}>{vivos}</b><span style={{ fontSize: 10.5, color: T.pasture }}>vivos</span></div>
              <div style={{ textAlign: "center" }}><b style={{ display: "block", fontSize: 20, color: T.pastureDk, fontFamily: "IBM Plex Mono,monospace" }}>{muertos}</b><span style={{ fontSize: 10.5, color: T.pasture }}>muertos</span></div>
              <div style={{ textAlign: "center" }}><b style={{ display: "block", fontSize: 20, color: T.pastureDk, fontFamily: "IBM Plex Mono,monospace" }}>{mort}%</b><span style={{ fontSize: 10.5, color: T.pasture }}>mortandad</span></div>
            </div>
          </header>

          <main style={{ padding: 16, maxWidth: 480, margin: "0 auto" }}>
            {cargando && <div style={{ textAlign: "center", color: T.inkSoft, fontSize: 13, marginBottom: 14 }}>Cargando…</div>}

            <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
              <h2 style={{ margin: "0 0 4px", fontSize: 15, color: T.pastureDk, fontFamily: "Space Grotesk,sans-serif" }}>Inicio de la parición</h2>
              <div style={{ fontSize: 12, color: T.inkSoft, marginBottom: 14 }}>
                {inicio ? `Inicio: ${fmtDate(inicio)} (${infoInicio.auto ? "detectado automáticamente" : "fijado a mano"})` : "Todavía no hay nacimientos cargados para detectar el inicio."}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input type="date" value={inicioInput} onChange={(e) => setInicioInput(e.target.value)} style={{ flex: 1, minWidth: 0, border: `1px solid ${T.line}`, background: "#fff", borderRadius: 7, padding: "10px 12px", fontSize: 15, fontFamily: "IBM Plex Mono,monospace" }} />
                <button onClick={corregirInicio} style={{ border: "none", borderRadius: 7, padding: "10px 14px", background: T.pasture, color: "#fff", fontWeight: 600, fontSize: 13.5, cursor: "pointer" }}>Corregir</button>
              </div>
            </div>

            {inicio && total > 0 && (
              <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
                <h2 style={{ margin: "0 0 4px", fontSize: 15, color: T.pastureDk, fontFamily: "Space Grotesk,sans-serif" }}>Cabeza / cuerpo / cola</h2>
                <div style={{ fontSize: 12, color: T.inkSoft, marginBottom: 14 }}>Cabeza: 45 días desde el primer ternero anotado · cuerpo y cola: tramos de 30 días</div>
                {[["Cabeza", cabeza, rango(0, CABEZA_DIAS - 1), false], ["Cuerpo", cuerpo, rango(CABEZA_DIAS, CABEZA_DIAS + TRAMO_DIAS - 1), false], ["Cola", cola, rango(CABEZA_DIAS + TRAMO_DIAS, null), true]].map(([label, arr, rangoTxt, esCola]) => (
                  <div key={label} style={{ marginBottom: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 5 }}>
                      <span style={{ fontWeight: 600, color: T.pastureDk }}>{label}</span>
                      <span style={{ color: T.inkSoft, fontSize: 11.5 }}>{rangoTxt}</span>
                      <span style={{ fontFamily: "IBM Plex Mono,monospace", fontWeight: 600 }}>{arr.length} · {pct(arr.length)}%</span>
                    </div>
                    <div style={{ background: T.paper, borderRadius: 6, height: 14, overflow: "hidden", border: `1px solid ${T.line}` }}>
                      <div style={{ height: "100%", background: esCola ? T.tagDk : T.pasture, width: `${pct(arr.length)}%` }} />
                    </div>
                  </div>
                ))}
                {previos.length > 0 && <div style={{ fontSize: 13, color: T.inkSoft }}>Antes del inicio: {previos.length}</div>}
              </div>
            )}

            {semanas.length > 0 && (
              <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
                <h2 style={{ margin: "0 0 4px", fontSize: 15, color: T.pastureDk, fontFamily: "Space Grotesk,sans-serif" }}>Avance semanal</h2>
                <div style={{ fontSize: 12, color: T.inkSoft, marginBottom: 6 }}>Nacimientos por semana · verde vivo, rojo muerto</div>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 5, height: 110, overflowX: "auto", paddingTop: 6 }}>
                  {semanas.map((s, i) => {
                    const hV = Math.round((s.v / maxSem) * 100), hM = Math.round((s.m / maxSem) * 100);
                    return (
                      <div key={i} title={`${s.total} nacimientos`} style={{ display: "flex", flexDirection: "column-reverse", width: 20, flexShrink: 0, borderRadius: "3px 3px 0 0", overflow: "hidden", background: T.line, minHeight: 2, height: `${Math.max(hV + hM, 2)}%` }}>
                        {s.m > 0 && <div style={{ background: T.soil, height: `${hM}%` }} />}
                        {s.v > 0 && <div style={{ background: T.ok, height: `${hV}%` }} />}
                      </div>
                    );
                  })}
                </div>
                <div style={{ display: "flex", gap: 5, marginTop: 4 }}>
                  {semanas.map((_, i) => <span key={i} style={{ width: 20, flexShrink: 0, fontSize: 9, textAlign: "center", color: T.inkSoft }}>s{i + 1}</span>)}
                </div>
              </div>
            )}

            <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 10, padding: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                <h2 style={{ margin: 0, fontSize: 15, color: T.pastureDk, fontFamily: "Space Grotesk,sans-serif" }}>Comparativo de campos</h2>
                <button onClick={cargarTodo} style={{ background: "none", border: `1px solid ${T.line}`, color: T.inkSoft, borderRadius: 7, padding: "6px 10px", cursor: "pointer" }}>↻</button>
              </div>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                <thead>
                  <tr>
                    <th style={{ textAlign: "left", padding: "7px 4px", color: T.inkSoft, fontWeight: 600, fontSize: 11, textTransform: "uppercase" }}>Campo</th>
                    <th style={{ textAlign: "right", padding: "7px 4px", color: T.inkSoft, fontWeight: 600, fontSize: 11, textTransform: "uppercase" }}>Nacidos</th>
                    <th style={{ textAlign: "right", padding: "7px 4px", color: T.inkSoft, fontWeight: 600, fontSize: 11, textTransform: "uppercase" }}>Muertos</th>
                    <th style={{ textAlign: "right", padding: "7px 4px", color: T.inkSoft, fontWeight: 600, fontSize: 11, textTransform: "uppercase" }}>Mort.</th>
                  </tr>
                </thead>
                <tbody>
                  {comparativo.map((r) => (
                    <tr key={r.campo} style={{ borderBottom: `1px solid ${T.line}` }}>
                      <td style={{ padding: "7px 4px" }}>{r.campo}</td>
                      <td style={{ padding: "7px 4px", textAlign: "right", fontFamily: "IBM Plex Mono,monospace" }}>{r.total}</td>
                      <td style={{ padding: "7px 4px", textAlign: "right", fontFamily: "IBM Plex Mono,monospace" }}>{r.muertos}</td>
                      <td style={{ padding: "7px 4px", textAlign: "right", fontFamily: "IBM Plex Mono,monospace", fontWeight: 600, color: r.mort >= 10 ? T.soil : T.ink }}>{r.total ? r.mort + "%" : "–"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
