<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test React</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous" onerror="document.body.innerHTML='<h1>FALLO al cargar React</h1>'"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous" onerror="document.body.innerHTML='<h1>FALLO al cargar ReactDOM</h1>'"></script>
</head>
<body style="font-family: sans-serif; padding: 24px;">
  <div id="root">Cargando…</div>
  <script>
    try {
      var el = React.createElement(
        "div",
        null,
        React.createElement("h1", { style: { color: "green" } }, "✅ Funciona"),
        React.createElement("p", null, "Hora: " + new Date().toString()),
        React.createElement("p", null, "User agent: " + navigator.userAgent)
      );
      ReactDOM.createRoot(document.getElementById("root")).render(el);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<pre style="white-space:pre-wrap;background:#eee;padding:12px;border-radius:8px;">' +
        ((err && (err.stack || err.message)) || String(err)) +
        "</pre>";
    }
  </script>
</body>
</html>
